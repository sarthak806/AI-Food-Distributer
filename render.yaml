services:
  - type: web
    name: shareplate
    runtime: node
    plan: free
    buildCommand: npm ci --prefix Backend && npm ci --prefix Frontend && VITE_Backend_URL=$RENDER_EXTERNAL_URL npm run build
    startCommand: npm start
    healthCheckPath: /api/donation/test
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          name: shareplate
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VITE_Backend_URL
        fromService:
          name: shareplate
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
